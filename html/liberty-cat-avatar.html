<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liberty the Cat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Oswald:wght@600&display=swap">
<style>
  /* Layout: the cat stands centre stage on light grey; emotion labels orbit him in an arc with the
     idle / walk switch under the sneakers. On narrow screens everything collapses into a tray. */
  :root {
    color-scheme: light;
    --bg: #f2f2f2;
    --ink: #1c2b4a;           /* the jacket */
    --muted: #7c869c;
    --pill: rgba(255, 255, 255, .9);
    --line: rgba(18, 22, 31, .18);
    --accent: #c8323a;        /* the star */
    --dark: #1c2b4a;
    --type: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --rx: min(46vh, calc(50vw - 84px));
    --ry: 36vh;
    --free: 100vh;
    --side: 100vh;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .poster {
    position: fixed; left: 50%; top: calc(var(--free) / 2);
    width: var(--side); height: var(--side); transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; transition: opacity .6s ease;
  }
  .poster.gone, .poster:not([src^="data:image"]) { opacity: 0; }

  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: var(--type); }
  .spot, .mode button {
    pointer-events: auto; font: 500 16px/1 var(--type); letter-spacing: .01em; color: var(--ink);
    cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .spot {
    position: absolute;
    left: calc(50% + var(--x) * var(--rx)); top: calc(var(--free) / 2 + var(--y) * var(--ry));
    transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 18px;
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(18, 22, 31, .06);
  }
  .spot.toward-right { flex-direction: row-reverse; } /* dot always faces the cat */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; transition: background .18s ease; }
  @media (hover: hover) { .spot:hover { border-color: var(--dark); } }
  .spot:focus-visible, .mode button:focus-visible { outline: 2px solid var(--dark); outline-offset: 3px; }
  .spot[aria-pressed="true"] {
    background: var(--dark); border-color: var(--dark); color: #fff; font-weight: 600;
    transform: translate(-50%, -50%) scale(1.07);
  }
  .spot[aria-pressed="true"] .dot { background: #fff; }
  /* when the cat gets bored, the labels quietly ask to be touched */
  .waiting .dot { animation: ping 1.4s ease-out infinite; }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(200, 50, 58, .5); }
    100% { box-shadow: 0 0 0 11px rgba(200, 50, 58, 0); }
  }

  .foot {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .mode {
    display: inline-flex; padding: 4px; gap: 4px; background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(18, 22, 31, .06);
  }
  .mode button { min-height: 40px; min-width: 92px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; }
  .mode button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .hint { font: 500 13px/1.3 var(--type); color: var(--muted); }

  @media (max-aspect-ratio: 23/20), (max-width: 720px) {
    .ui {
      inset: auto 0 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .spot, .spot[aria-pressed="true"] { position: static; transform: none; justify-content: center; padding: 0 2px; font-size: 14px; }
    .dot { display: none; }
    .foot { position: static; grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    .waiting .dot { animation: none; }
    .spot, .poster, .mode button { transition: none; }
  }
</style>

<script>
  // Shared by the poster (before 3D loads) and the camera, so both frame the cat identically.
  // V = world units visible vertically; the cat always gets at least TALL units of free height.
  window.TALL = 4.3;
  window.framing = () => {
    const w = innerWidth, h = innerHeight;
    const tray = matchMedia('(max-aspect-ratio: 23/20), (max-width: 720px)').matches;
    const panel = tray ? document.getElementById('ui').offsetHeight : 0;
    const free = h - panel;
    const V = Math.max(TALL * h / free, 3.3 * h / w);
    const root = document.documentElement.style;
    root.setProperty('--free', free + 'px');
    root.setProperty('--side', (TALL / V) * h + 'px');
    return { V, panel };
  };
  window.framing();

// ---------- interaction ----------
const PATIENCE = 8; // seconds of being ignored before the cat starts tapping a foot

}

// idle / walk
const idleBtn = document.getElementById('idle'), walkBtn = document.getElementById('walk');
const walk = { on: false, w: 0, phase: 0 }; // w eases 0..1 as the cat gets going; phase runs 0..1 over two steps

}

walkBtn.addEventListener('click', () => setWalking(true));

// for whoever embeds the cat. Emotions: the eight buttons, plus the sheet's own names.
const ALIAS = { neutral: null, excited: 'euphoric', determined: 'angry' };
window.avatar = {
  setEmotion(name) {
    clearTimeout(holdTimer);
    if (name === 'wink') { setEmotion(null); winkUntil = clock.elapsedTime + 1.1; return; }
    if (name in ALIAS) name = ALIAS[name];
    setEmotion(name in POSES ? name : null);

  setMotion(name) { setWalking(name === 'walk'); },

const POGO = { t: -1, hop: 0.46, hops: 2, height: 0.36 };
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; lastAttention = clock.elapsedTime; });
renderer.domElement.addEventListener('pointerup', e => {

controls.addEventListener('change', () => { if (down) lastAttention = clock.elapsedTime; });
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointerX = (e.clientX / innerWidth) * 2 - 1; pointerY = (e.clientY / innerHeight) * 2 - 1; } });

// ---------- adaptive quality: fewer pixels, then fewer plush layers, when frames get slow ----------
const LEVELS = [

  { pr: Math.min(devicePixelRatio, 1.2), step: 1 },

// ---------- animation ----------
const TAU = Math.PI * 2, ease = u => u * u * (3 - 2 * u);

// One foot's path through a walking cycle: on the floor sliding back, then lifted and carried forward.
const STEP = { y: 0, z: 0, pitch: 0 }, STANCE = 0.56;

    _e.set(0.3 * w * F.pitch - 0.7 * tap + 0.35 * air, l.sx * 0.1, 0, 'YXZ');

renderer.setAnimationLoop(tick);
