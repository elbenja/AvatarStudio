<title>Toronto Baseball Robot</title>

<style>
  /* Layout: the robot stands centre stage on light grey; emotion labels orbit him in an arc with the
     idle / walk switch under his sneakers. On narrow screens everything collapses into a tray. */
  :root {
    color-scheme: light;
    --bg: #f2f2f2;
    --ink: #12161f;           /* the visor */
    --muted: #7c869c;
    --pill: rgba(255, 255, 255, .9);
    --line: rgba(18, 22, 31, .18);
    --accent: #1747b5;        /* the hoodie */
    --dark: #12161f;
    --type: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --rx: min(46vh, calc(50vw - 84px));
    --ry: 36vh;
    --free: 100vh;
    --side: 100vh;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .poster {
    position: fixed; left: 50%; top: calc(var(--free) / 2);
    width: var(--side); height: var(--side); transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; transition: opacity .6s ease;
  }
  .poster.gone, .poster:not([src^="data:image"]) { opacity: 0; }

  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: var(--type); }
  .spot, .mode button {
    pointer-events: auto; font: 500 16px/1 var(--type); letter-spacing: .01em; color: var(--ink);
    cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .spot {
    position: absolute;
    left: calc(50% + var(--x) * var(--rx)); top: calc(var(--free) / 2 + var(--y) * var(--ry));
    transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 18px;
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(18, 22, 31, .06);
  }
  .spot.toward-right { flex-direction: row-reverse; } /* dot always faces the robot */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); flex: none; transition: background .18s ease; }
  @media (hover: hover) { .spot:hover { border-color: var(--dark); } }
  .spot:focus-visible, .mode button:focus-visible { outline: 2px solid var(--dark); outline-offset: 3px; }
  .spot[aria-pressed="true"] {
    background: var(--dark); border-color: var(--dark); color: #fff; font-weight: 600;
    transform: translate(-50%, -50%) scale(1.07);
  }
  .spot[aria-pressed="true"] .dot { background: #fff; }
  /* when the robot loses patience, the labels quietly ask to be touched */
  .waiting .dot { animation: ping 1.4s ease-out infinite; }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(23, 71, 181, .5); }
    100% { box-shadow: 0 0 0 11px rgba(23, 71, 181, 0); }
  }

  .foot {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .mode {
    display: inline-flex; padding: 4px; gap: 4px; background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(18, 22, 31, .06);
  }
  .mode button { min-height: 40px; min-width: 92px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; }
  .mode button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .hint { font: 500 13px/1.3 var(--type); color: var(--muted); }

  @media (max-aspect-ratio: 23/20), (max-width: 720px) {
    .ui {
      inset: auto 0 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .spot, .spot[aria-pressed="true"] { position: static; transform: none; justify-content: center; padding: 0 2px; font-size: 14px; }
    .dot { display: none; }
    .foot { position: static; grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    .waiting .dot { animation: none; }
    .spot, .poster, .mode button { transition: none; }
  }
</style>

  hx: -0.82, hy: 0.8, hz: 0.04,                                           // where his right hand is
  lx: 0.82, ly: 0.8, lz: 0.04,                                            // and his left
  pace: 1,                                                                // how briskly he walks
};
const PILLS = ['pill', 'pill'], WINK = ['pill', 'dash'];
const SHAPES = { happy: ['arc', 'arc'], euphoric: ['chev', 'chev'] };     // the eye on the viewer's left, then the other
const POSES = {
  happy:       { headPitch: -0.06, headTilt: 0.05, hx: -0.9, hy: 1.5, hz: 0.25 },
  euphoric:    { pitch: -0.04, headPitch: -0.12, hx: -0.92, hy: 1.75, hz: 0.1, lx: 0.92, ly: 1.75, lz: 0.1, pace: 1.35 },
  surprised:   { eW: 1.3, eH: 1.22, pitch: -0.07, headPitch: -0.06, squash: -0.03, hx: -0.95, hy: 1.05, hz: 0.2, lx: 0.95, ly: 1.05, lz: 0.2 },
  curious:     { big: 0.22, eX: 0.5, lean: 0.06, turn: 0.2, pitch: 0.05, headTilt: 0.26, headTurn: 0.1, headPitch: 0.05, hx: -0.38, hy: 1.3, hz: 0.45 },
  sleepy:      { eH: 0.8, lid: 0.55, eY: -0.5, lean: -0.05, pitch: 0.06, squash: 0.03, headPitch: 0.2, headTilt: -0.12, hz: 0.1, lz: 0.1, pace: 0.5 },
  sad:         { eH: 0.85, slant: -0.6, eY: -0.6, pitch: 0.09, squash: 0.04, headPitch: 0.28, hx: -0.72, hz: 0.12, lx: 0.72, lz: 0.12, pace: 0.6 },
  embarrassed: { eH: 0.7, eW: 1.05, eX: 0.6, eY: -0.5, blush: 1, turn: 0.14, squash: 0.02, headTurn: 0.3, headPitch: 0.13, headTilt: 0.08, hx: -0.78, hy: 1.66, hz: 0.16, lx: 0.5, ly: 0.95, lz: 0.42 },
  angry:       { eW: 1.5, eH: 0.8, slant: 0.75, pitch: 0.1, crouch: 0.02, headPitch: 0.04, hx: -0.82, hy: 1.18, hz: 0.34, lx: 0.74, ly: 0.96, lz: 0.14, pace: 1.3 },
  focused:     { eW: 1.4, eH: 0.9, slant: 0.4, pitch: 0.1, crouch: 0.04, headPitch: -0.02, hx: -0.5, hy: 1.02, hz: 0.42, lx: 0.5, ly: 1.02, lz: 0.42 }, // on the sheet; no button
};
const IMPATIENT = { slant: 0.3, eW: 1.25, eH: 0.85, headTilt: 0.1, headTurn: -0.08, hx: -0.74, hy: 0.96, hz: 0.14, lx: 0.74, ly: 0.96, lz: 0.14 };

// t = clock time, e = seconds since this emotion started
const MOTION0 = { hop: 0, lean: 0, pitch: 0, turn: 0, squash: 0, crouch: 0, headPitch: 0, headTilt: 0, headTurn: 0, hx: 0, hy: 0, hz: 0, lx: 0, ly: 0, lz: 0, lid: 0, footL: 0, footR: 0 };
const MOTIONS = {
  happy:       (t, a) => { const b = Math.abs(Math.sin(t * 5)); a.crouch = 0.03 * (1 - b); a.headTilt = 0.09 * Math.sin(t * 2.5); a.lean = 0.03 * Math.sin(t * 2.5); a.hx = 0.09 * Math.sin(t * 9); a.hy = 0.03 * Math.cos(t * 9); },
  euphoric:    (t, a) => { const s = Math.abs(Math.sin(t * 6)); a.hop = 0.3 * s; a.squash = 0.09 * (1 - s) ** 6; a.hy = 0.06 * Math.sin(t * 12); a.ly = 0.06 * Math.sin(t * 12 + 1.2); a.lean = 0.04 * Math.sin(t * 3); a.headTilt = 0.06 * Math.sin(t * 6); },
  surprised:   (t, a, e) => { a.hop = e < 0.4 ? 0.24 * Math.sin((Math.PI * e) / 0.4) : 0; a.lean = e < 1 ? 0.012 * Math.sin(e * 40) * (1 - e) : 0; },
  curious:     (t, a) => { a.lean = 0.05 * Math.sin(t * 0.85); a.headTilt = 0.06 * Math.sin(t * 0.85 + 0.6); a.headPitch = 0.02 * Math.sin(t * 1.7); },
  sleepy:      (t, a) => { const n = (t * 0.3) % 1; a.headPitch = 0.2 * n * n; a.lid = 0.38 * n * n; a.lean = 0.02 * Math.sin(t * 0.6); a.squash = 0.016 * Math.sin(t * 1.2); },
  sad:         (t, a) => { const sniff = Math.max(0, Math.sin(t * 1.6)) ** 12; a.squash = 0.014 * Math.sin(t * 0.9); a.headTurn = 0.05 * Math.sin(t * 0.7); a.headPitch = -0.05 * sniff; },
  embarrassed: (t, a) => { a.lean = 0.05 * Math.sin(t * 2); a.turn = 0.06 * Math.sin(t * 2); a.headTurn = 0.05 * Math.sin(t * 2 + 0.5); a.hy = 0.04 * Math.sin(t * 11); a.hx = 0.02 * Math.cos(t * 11); a.lx = 0.03 * Math.sin(t * 4); },
  angry:       (t, a) => { const bang = Math.sin(t * 6.5); a.lean = 0.016 * Math.sin(t * 42); a.turn = 0.014 * Math.sin(t * 37); a.hy = 0.07 * Math.sin(t * 13); a.footR = Math.max(0, -bang) * 0.3; },
  focused:     (t, a) => { a.crouch = 0.012 * Math.sin(t * 3); a.hz = 0.05 * Math.max(0, Math.sin(t * 6)); a.lz = 0.05 * Math.max(0, -Math.sin(t * 6)); },
};
// ---------- interaction ----------
const PATIENCE = 8; // seconds of being ignored before he puts his hands on his hips and taps a foot
const uiEl = document.getElementById('ui');
const buttons = [...uiEl.querySelectorAll('.spot')];
const clock = new THREE.Clock();
let current = null, enteredAt = 0, lastAttention = 0, holdTimer = 0, pointerX = 0, pointerY = 0, winkUntil = -10;

function setEmotion(name) {
  if (name !== current) enteredAt = clock.elapsedTime;
  current = name;
  lastAttention = clock.elapsedTime;
  for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.emo === name));
}
// Tap / keyboard: show it for a few seconds; doing it again dismisses it.
function activate(name) {
  clearTimeout(holdTimer);
  if (current === name) return setEmotion(null);
  setEmotion(name);
  holdTimer = setTimeout(() => setEmotion(null), 4500);
}
let lastPointerAt = -1e9; // a click or focus right after real pointer input is that same gesture
const fromPointer = () => performance.now() - lastPointerAt < 800;
for (const b of buttons) {
  const name = b.dataset.emo;
  // Rollover is for a real mouse only.
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { clearTimeout(holdTimer); setEmotion(name); } });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setEmotion(null); });
  // Touch acts on pointerup, never on click: a tap's click can report pointerType "mouse"
  // (or none), so click can't tell a tap from a mouse press that the rollover already handled.
  b.addEventListener('pointerup', e => {
    lastPointerAt = performance.now();
    if (e.pointerType !== 'mouse') activate(name);
  });
  // Keyboard and assistive tech arrive as a click with no pointer gesture before it.
  b.addEventListener('click', () => { if (!fromPointer()) activate(name); });
  b.addEventListener('focus', () => { if (b.matches(':focus-visible') && !fromPointer()) setEmotion(name); });
  b.addEventListener('blur', () => { if (current === name && !fromPointer()) setEmotion(null); });
}

// idle / walk
const idleBtn = document.getElementById('idle'), walkBtn = document.getElementById('walk');
const walk = { on: false, w: 0, phase: 0 }; // w eases 0..1 as he gets going; phase runs 0..1 over two steps
function setWalking(on) {
  if (on && walk.w < 0.05) walk.phase = 0.56; // he starts by lifting his left foot
  walk.on = on;
  idleBtn.setAttribute('aria-pressed', String(!on)); walkBtn.setAttribute('aria-pressed', String(on));
  lastAttention = clock.elapsedTime;
}
idleBtn.addEventListener('click', () => setWalking(false));
walkBtn.addEventListener('click', () => setWalking(true));

// for whoever embeds him. Emotions: the eight buttons, plus the sheet's own names.
const ALIAS = { neutral: null, excited: 'euphoric' };
window.avatar = {
  setEmotion(name) {
    clearTimeout(holdTimer);
    if (name === 'wink') { setEmotion(null); winkUntil = clock.elapsedTime + 1.1; return; }
    if (name in ALIAS) name = ALIAS[name];
    setEmotion(name in POSES ? name : null);
  },
  setMotion(name) { setWalking(name === 'walk'); },
};

const POGO = { t: -1, hop: 0.46, hops: 2, height: 0.36 };
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; lastAttention = clock.elapsedTime; });
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
    clearTimeout(holdTimer);
    if (current) setEmotion(null);
    if (POGO.t < 0) POGO.t = 0;
  }
  down = null;
  lastAttention = clock.elapsedTime;
});
controls.addEventListener('change', () => { if (down) lastAttention = clock.elapsedTime; });
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointerX = (e.clientX / innerWidth) * 2 - 1; pointerY = (e.clientY / innerHeight) * 2 - 1; } });

// ---------- adaptive quality: fewer pixels when frames get slow ----------
const LEVELS = [Math.min(devicePixelRatio, 1.5), Math.min(devicePixelRatio, 1.2), 1, 0.75, 0.6];
const quality = { level: 0, seconds: 0, frames: 0, lastFps: 0, misses: 0, locked: false };
function applyLevel(level) {
  quality.level = level;
  renderer.setPixelRatio(LEVELS[level]);
  renderer.setSize(innerWidth, innerHeight);
}
function trackFrameRate(rawDt) {
  if (quality.locked) return;
  quality.seconds += rawDt; quality.frames++;
  if (quality.seconds < 1.2) return;
  const fps = quality.frames / quality.seconds;
  quality.seconds = quality.frames = 0;
  if (fps >= 26) return;
  // If shedding quality doesn't help, the browser is throttling us and the GPU isn't the
  // limit (background tab, embedded preview), so go back to full quality and stop adapting.
  if (quality.level > 0 && fps < quality.lastFps * 1.2) {
    if (++quality.misses >= 2) { quality.locked = true; applyLevel(0); return; }
  } else quality.misses = 0;
  quality.lastFps = fps;
  if (quality.level < LEVELS.length - 1) applyLevel(quality.level + 1);
}
document.addEventListener('visibilitychange', () => { clock.getDelta(); quality.seconds = quality.frames = 0; });
// ---------- animation ----------
const TAU = Math.PI * 2, ease = u => u * u * (3 - 2 * u);
const cur = { ...NEUTRAL };
const motion = { ...MOTION0 }, smooth = { ...MOTION0 };
const swing = { x: 0, v: 0 }, flop = { x: 0, v: 0 }; // follow-through from spinning / from hopping
const look = { x: 0, y: 0 };
const eyes = { shown: PILLS, next: null, swapAt: -10, key: '' }, SWAP = 0.18;
let prevRel = null, prevY = 0, prevVy = 0, nextBlink = 2, blinkAt = -10, frames = 0, impatience = 0;
const _t = V3(), _p = V3(), _a = V3();
const _q1 = new THREE.Quaternion(), _e = new THREE.Euler();

// One foot's path through a walking cycle: on the floor sliding back, then lifted and carried forward.
const STEP = { y: 0, z: 0, pitch: 0 }, STANCE = 0.56;
function step(p) {
  const F = STEP;
  if (p < STANCE) { F.z = 1 - (2 * p) / STANCE; F.y = 0; F.pitch = 0; }
  else { const u = (p - STANCE) / (1 - STANCE); F.z = -1 + 2 * ease(u); F.y = Math.sin(Math.PI * u); F.pitch = Math.sin(TAU * u); } // toe down as it leaves, toe up as it lands
  return F;
}
const CADENCE = 1.3, STRIDE = 0.1, LIFT = 0.09; // cycles per second; half a step's length; how high a foot lifts

function tick() {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.1), t = clock.elapsedTime;
  trackFrameRate(rawDt);

  // losing patience: ramps in after being ignored while idle
  const ignored = !current && !walk.on && t - lastAttention > PATIENCE;
  impatience += ((ignored ? 1 : 0) - impatience) * Math.min(dt * 3, 1);
  uiEl.classList.toggle('waiting', ignored);

  // settle into the pose
  const pose = current ? POSES[current] : null;
  const k = 1 - Math.exp(-dt * 9);
  for (const key of Object.keys(cur)) {
    let target = NEUTRAL[key];
    if (pose) { if (key in pose) target = pose[key]; }
    else if (key in IMPATIENT) target = lerp(target, IMPATIENT[key], impatience);
    cur[key] += (target - cur[key]) * k;
  }

  // the emotion's ongoing motion (or, ignored: hands on hips and a tapping foot)
  for (const key of Object.keys(motion)) motion[key] = 0;
  if (current) MOTIONS[current](t, motion, t - enteredAt);
  else if (impatience > 0.01) {
    const gate = smoothstep(0.86 - ((t / 4.4) % 1), 0, 0.06); // ~3.8s on, a beat off
    motion.footR = Math.max(0, Math.sin(t * 9.5)) * 0.3 * impatience * gate;
    motion.lean = 0.02 * Math.sin(t * 1.75) * impatience;
  }
  const km = 1 - Math.exp(-dt * 22);
  for (const key of Object.keys(motion)) smooth[key] += (motion[key] * CALM - smooth[key]) * km;

  // walking: how far into it he is, and where in the cycle
  walk.w += ((walk.on ? 1 : 0) - walk.w) * (1 - Math.exp(-dt * 4));
  const w = ease(clamp(walk.w, 0, 1)), still = 1 - w;
  if (walk.w > 0.005) walk.phase = (walk.phase + dt * CADENCE * (0.55 + 0.45 * cur.pace)) % 1;
  const ph = walk.phase, s1 = Math.sin(TAU * ph), c1 = Math.cos(TAU * ph); // his left heel lands at 0, his right at 0.5

  // canvas tap: a couple of jumps, then a wink
  let pogoY = 0, pogoSquash = 0;
  if (POGO.t >= 0) {
    POGO.t += dt;
    const n = POGO.t / POGO.hop;
    if (n >= POGO.hops) { POGO.t = -1; winkUntil = t + 0.9; }
    else {
      const p = n % 1;
      pogoY = POGO.height * Math.sin(Math.PI * p) * CALM;
      pogoSquash = Math.max(0, 1 - Math.min(p, 1 - p) / 0.12) * 0.12 * CALM;
    }
  }
  const y = pogoY + smooth.hop;
  const air = clamp(y / 0.36, 0, 1);
  const vy = (y - prevY) / Math.max(dt, 1e-4), acc = (vy - prevVy) / Math.max(dt, 1e-4);
  prevY = y; prevVy = vy;

  // the whole robot: jumps, and turns a little toward the pointer
  rig.position.y = y;
  rig.rotation.y += (pointerX * 0.28 - rig.rotation.y) * Math.min(dt * 3, 1);
  look.x += (pointerX - look.x) * Math.min(dt * 4, 1); look.y += (pointerY - look.y) * Math.min(dt * 4, 1);

  // hips: idle, his weight drifts from foot to foot; walking, they bob, sway over the standing foot and turn with the stepping one
  const breathe = Math.sin(t * (current === 'sleepy' ? 1.2 : 2.3));
  const shift = (0.6 * Math.sin(t * 0.43) + 0.4 * Math.sin(t * 0.29 + 1.3)) * CALM;
  const squash = cur.squash + smooth.squash + pogoSquash;
  const crouch = cur.crouch + smooth.crouch + squash * 0.6 + w * 0.012;
  const sway = 0.04 * w * s1 + 0.025 * still * shift;
  const hipRoll = 0.035 * w * s1 - 0.012 * still * shift;
  hips.position.set(sway, HIP_Y - crouch - 0.02 * w * Math.cos(2 * TAU * ph), 0.015 * w);
  hips.rotation.set(0.03 * w, -0.09 * w * c1, hipRoll);

  // chest: turns against the hips, breathes
  const chestLean = cur.lean + smooth.lean - 0.03 * w * s1 + still * (0.012 * Math.sin(t * 0.9) + 0.012 * shift);
  chest.rotation.set(cur.pitch + smooth.pitch + 0.05 * w, cur.turn + smooth.turn + 0.17 * w * c1, chestLean);
  chest.scale.set(1 + squash * 0.5 - breathe * 0.005, 1 - squash * 0.7 + breathe * 0.012 * CALM, 1 + squash * 0.5 + breathe * 0.004);

  // head: stays level and keeps looking ahead, with a little life of its own
  const wander = still * CALM * (current ? 0.3 : 1);
  head.rotation.set(
    cur.headPitch + smooth.headPitch - 0.03 * w + 0.1 * look.y + wander * 0.025 * Math.sin(t * 0.53 + 1) + 0.012 * w * Math.cos(2 * TAU * ph + 0.8),
    cur.headTurn + smooth.headTurn - 0.08 * w * c1 + 0.22 * look.x + wander * 0.07 * Math.sin(t * 0.37 + 2),
    cur.headTilt + smooth.headTilt - 0.7 * (hipRoll + chestLean) + wander * 0.02 * Math.sin(t * 0.61));
  rig.updateMatrixWorld(true);

  // legs: each sneaker goes where the step puts it, and the knees follow
  const stride = STRIDE * (0.6 + 0.4 * cur.pace);
  for (const l of legs) {
    const F = step((ph + (l.sx > 0 ? 0 : 0.5)) % 1), tap = l.sx > 0 ? smooth.footL : smooth.footR;
    _t.set(l.sx * (HIP.x + 0.01 * air), ANKLE + w * LIFT * F.y + 0.06 * tap + 0.05 * air, w * stride * F.z + 0.06 * tap);
    _e.set(0.3 * w * F.pitch - 0.7 * tap + 0.35 * air, l.sx * 0.12, 0, 'YXZ');
    reach(l, pointIn(hips, _t), _p.set(l.sx * 0.15, 0, 1), turnIn(hips, _q1.setFromEuler(_e)));
    const len = _a.copy(_t).sub(l.upper.position).length();
    l.pants.quaternion.setFromUnitVectors(DOWN, _a.divideScalar(len));
    l.pants.scale.y = clamp(len / (LEG1 + LEG2), 0.72, 1);
  }

  // arms: both hands hang free; they swing against the legs, wave, shake
  for (const a of arms) {
    const left = a.sx > 0;
    _t.set((left ? cur.lx + smooth.lx : cur.hx + smooth.hx) + a.sx * 0.08 * air,
      (left ? cur.ly + smooth.ly : cur.hy + smooth.hy) + 0.01 * breathe + 0.25 * air + 0.03 * w * Math.abs(c1),
      (left ? cur.lz + smooth.lz : cur.hz + smooth.hz) - a.sx * 0.2 * w * c1 - 0.2 * swing.x);
    reach(a, _t, _p.set(a.sx * 0.8, -0.2, -0.6));
  }

  // follow-through: spinning the view makes the drawstrings trail, jumping makes them and the cap bounce
  const rel = rig.rotation.y - controls.getAzimuthalAngle();
  if (prevRel === null) prevRel = rel;
  const dRel = Math.atan2(Math.sin(rel - prevRel), Math.cos(rel - prevRel));
  prevRel = rel;
  const omega = clamp(dRel / Math.max(dt, 1e-4), -8, 8);
  swing.v += (40 * (omega * 0.05 - swing.x) - 5 * swing.v) * dt;
  swing.x += swing.v * dt;
  flop.v += (-70 * flop.x - 7 * flop.v - clamp(acc, -200, 200) * 0.004) * dt;
  flop.x += flop.v * dt;
  strings.rotation.z = clamp(swing.x * 0.3 + 0.5 * chestLean + 0.03 * w * s1, -0.2, 0.2);
  strings.scale.y = 1 + clamp(flop.x * 0.25, -0.08, 0.08);
  cap.position.y = CAP.y + clamp(flop.x * 0.12, -0.012, 0.04);
  cap.rotation.x = -CAP.tilt + clamp(-flop.x * 0.1, -0.05, 0.05);

  // face: the eyes change shape through a quick blink, and blink on their own every few seconds
  const want = current && SHAPES[current] ? SHAPES[current] : t < winkUntil ? WINK : PILLS;
  if (!eyes.next && (want[0] !== eyes.shown[0] || want[1] !== eyes.shown[1])) { eyes.next = want; eyes.swapAt = t; }
  const su = (t - eyes.swapAt) / SWAP;
  if (eyes.next && su >= 0.5) { eyes.shown = eyes.next; eyes.next = null; }
  const gate = su < 1 ? Math.abs(1 - 2 * su) : 1;
  const blinkLen = current === 'sleepy' ? 0.5 : 0.14;
  if (t > nextBlink) { blinkAt = t; nextBlink = t + 2 + Math.random() * 3; }
  const bp = (t - blinkAt) / blinkLen, shut = bp < 1 ? Math.sin(Math.PI * bp) : 0;
  const open = s => gate * (s === 'pill' ? 1 - 0.94 * shut : 1), r2 = v => Math.round(v * 50) / 50;
  const f = {
    L: eyes.shown[0], R: eyes.shown[1], oL: r2(open(eyes.shown[0])), oR: r2(open(eyes.shown[1])),
    w: r2(cur.eW), h: r2(cur.eH), slant: r2(cur.slant), lid: r2(clamp(cur.lid + smooth.lid, 0, 0.92)),
    gx: r2(clamp(cur.eX + 0.7 * look.x, -1.2, 1.2)), gy: r2(clamp(cur.eY - 0.6 * look.y, -1.2, 1.2)), big: r2(cur.big), blush: r2(cur.blush),
  };
  const faceKey = JSON.stringify(f);
  if (faceKey !== eyes.key) { eyes.key = faceKey; drawFace(f); }

  // shadows
  bodyShadow.scale.setScalar(1 - air * 0.3);
  bodyShadow.material.opacity = bodyShadow.userData.opacity * (1 - air * 0.5);
  bodyShadow.position.x = rig.position.x + sway * 0.6;
  legs.forEach((l, i) => {
    const s = footShadows[i], lift = l.end.getWorldPosition(_a).y - ANKLE;
    s.position.set(_a.x, 0.005, _a.z + 0.05); s.rotation.z = rig.rotation.y;
    s.material.opacity = s.userData.opacity * clamp(1 - lift / 0.3, 0, 1);
  });

  controls.update();
  renderer.render(scene, camera);
  if (++frames === 3) document.getElementById('poster')?.classList.add('gone');
}
renderer.setAnimationLoop(tick);
</script>
</body>
</html>
