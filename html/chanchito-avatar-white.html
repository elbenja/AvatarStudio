<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chanchito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&display=swap">
<style>
  /* Layout: the plush stands centre stage on slate; emotion labels orbit it in an arc,
     and collapse into a 4x2 tray under it on narrow screens. */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --ink: #1e293b;           /* slate-800 */
    --muted: #64748b;         /* slate-500 */
    --pill: rgba(255, 255, 255, .85);
    --line: rgba(100, 116, 139, .28);
    --honey: #ffc53d;         /* the fur */
    --on-honey: #1f1503;
    --type: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --rx: min(44vh, calc(50vw - 84px));
    --ry: 38vh;
    --free: 100vh;
    --side: 100vh;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .poster {
    position: fixed; left: 50%; top: calc(var(--free) / 2);
    width: var(--side); height: var(--side); transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; transition: opacity .6s ease;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to right, transparent, #000 12%, #000 88%, transparent), linear-gradient(transparent, #000 4%, #000 96%, transparent);
    mask-composite: intersect;
  }
  .poster.gone { opacity: 0; }

  .spots { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: var(--type); }
  .spot {
    position: absolute; pointer-events: auto;
    left: calc(50% + var(--x) * var(--rx)); top: calc(50% + var(--y) * var(--ry));
    transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 18px;
    font: 500 16px/1 var(--type); letter-spacing: .01em; color: var(--ink);
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease;
  }
  .spot.toward-right { flex-direction: row-reverse; } /* dot always faces the plush */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--honey); flex: none; transition: background .18s ease; }
  @media (hover: hover) { .spot:hover { border-color: var(--honey); } }
  .spot:focus-visible { outline: 2px solid var(--honey); outline-offset: 3px; }
  .spot[aria-pressed="true"] {
    background: var(--honey); border-color: var(--honey); color: var(--on-honey); font-weight: 600;
    transform: translate(-50%, -50%) scale(1.07);
  }
  .spot[aria-pressed="true"] .dot { background: var(--on-honey); }
  /* when the plush loses patience, the labels quietly ask to be touched */
  .waiting .dot { animation: ping 1.4s ease-out infinite; }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(255, 197, 61, .6); }
    100% { box-shadow: 0 0 0 11px rgba(255, 197, 61, 0); }
  }
  /* idle / walk switch, under the feet */
  .foot {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .mode {
    display: inline-flex; padding: 4px; gap: 4px; background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    pointer-events: auto;
  }
  .mode button {
    min-height: 40px; min-width: 92px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent;
    font: 500 16px/1 var(--type); color: var(--ink); cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .18s ease, color .18s ease;
  }
  .mode button[aria-pressed="true"] { background: var(--honey); color: var(--on-honey); font-weight: 600; }
  .mode button:focus-visible { outline: 2px solid var(--honey); outline-offset: 3px; }
  .hint { font: 500 13px/1.3 var(--type); color: var(--muted); }

  @media (max-aspect-ratio: 23/20), (max-width: 720px) {
    .spots {
      inset: auto 0 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    }
    .spot, .spot[aria-pressed="true"] { position: static; transform: none; justify-content: center; padding: 0 2px; font-size: 14px; }
    .dot { display: none; }
    .foot { position: static; grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    .waiting .dot { animation: none; }
    .spot, .poster, .mode button { transition: none; }
  }
</style>

<script>
  // Shared by the poster (before 3D loads) and the camera, so both frame the plush identically.
  // V = world units visible vertically; the plush always gets at least 4.2 units of free height.
  window.framing = () => {
    const w = innerWidth, h = innerHeight;
    const tray = matchMedia('(max-aspect-ratio: 23/20), (max-width: 720px)').matches;
    const panel = tray ? document.getElementById('spots').offsetHeight : 0;
    const free = h - panel;
    const V = Math.max(4.2 * h / free, 3.4 * h / w);
    const root = document.documentElement.style;
    root.setProperty('--free', free + 'px');
    root.setProperty('--side', (4.2 / V) * h + 'px');
    return { V, panel };
  };
  window.framing();
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- palette ----------
const C = {
  bg: '#ffffff',
  fur: '#ffc848', furTip: '#ffdc70',            // amber plush: renders close to #F4BC44
  felt: '#ff9a63', feltTip: '#ffb98f',          // snout + inner ears
  skin: '#f3cf9f', skinLight: '#f7dcb5', skinDark: '#ecbf87',
  mouth: '#3b1d10', eye: '#0b0807',
  blush: new THREE.Color('#f58f86'), blushAngry: new THREE.Color('#e8342c'),
};
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.3 : 1;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = THREE.MathUtils.clamp;

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

const camera = new THREE.PerspectiveCamera(26, innerWidth / innerHeight, 1, 40);
camera.position.set(0.7, 1.75, 9);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.32, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.minPolarAngle = 0.95;
controls.maxPolarAngle = 1.72;

function fit() {
  const { V, panel } = window.framing();
  const w = innerWidth, h = innerHeight, d = 9;
  camera.aspect = w / h;
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(V / 2 / d));
  if (panel) camera.setViewOffset(w, h, 0, panel / 2, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
fit();
addEventListener('resize', fit);

const KEY_DIR = new THREE.Vector3(2.5, 5, 4.5).normalize();
const key = new THREE.DirectionalLight('#fff3e0', 1.9);
key.position.copy(KEY_DIR).multiplyScalar(10);
const fill = new THREE.DirectionalLight('#dfe8ff', 0.5);
fill.position.set(-4, 2, 3);
scene.add(key, fill, new THREE.HemisphereLight('#ffffff', '#3a3f55', 0.5));

// ---------- body profile: wide hooded head on a small pear, one mass with a soft neck crease ----------
const PROFILE = [
  [0.00, 0.215], [0.26, 0.225], [0.50, 0.275], [0.67, 0.39], [0.75, 0.56], [0.765, 0.72], [0.735, 0.88], [0.675, 1.00],
  [0.64, 1.065], [0.74, 1.10], [0.88, 1.17], [0.965, 1.30], [1.00, 1.52], [0.98, 1.747], [0.92, 1.951], [0.80, 2.165],
  [0.62, 2.349], [0.40, 2.475], [0.20, 2.533], [0.00, 2.55],
];
const prof = new THREE.SplineCurve(PROFILE.map(([x, y]) => new THREE.Vector2(x, y))).getSpacedPoints(160);
prof.forEach(p => { p.x = Math.max(p.x, 0); });
prof[0].x = 0; prof[prof.length - 1].x = 0;

// radius lookup table: the face, eyes and mouth query it hundreds of times per frame
const LUT_N = 800, Y0 = prof[0].y, Y1 = prof[prof.length - 1].y, LUT = new Float32Array(LUT_N + 1);
for (let i = 0, j = 1; i <= LUT_N; i++) {
  const y = Y0 + (i / LUT_N) * (Y1 - Y0);
  while (j < prof.length - 1 && prof[j].y < y) j++;
  const a = prof[j - 1], b = prof[j];
  LUT[i] = a.x + (b.x - a.x) * clamp((y - a.y) / (b.y - a.y || 1), 0, 1);
}
function radiusAt(y) {
  const f = clamp((y - Y0) / (Y1 - Y0), 0, 1) * LUT_N, i = Math.min(f | 0, LUT_N - 1);
  return LUT[i] + (LUT[i + 1] - LUT[i]) * (f - i);
}
const DEPTH = 0.9; // front to back, the plush is a little shallower than it is wide
const surfZ = (x, y) => DEPTH * Math.sqrt(Math.max(radiusAt(y) ** 2 - x * x, 0));

// distance from any (radius, height) to the profile, baked on a grid; negative inside
const DG = 0.0125, DW = 116, DH = 236, DY = -0.15, profGrid = new Float32Array(DW * DH);
for (let j = 0, n = 0; j < DH; j++) for (let i = 0; i < DW; i++, n++) {
  const r = i * DG, y = DY + j * DG;
  let best = 1e9;
  for (let s = 1; s < prof.length; s++) {

function updateEye(e, p, blink) {
  const rx = EYE.r * p.rx, ry = EYE.r * 1.06 * p.ry;
  const cx = e.side * EYE.x + p.gx * 0.05, cy = EYE.y + p.gy * 0.04;
  const T = lerp(p.top, -0.2, blink), B = lerp(p.bot, -0.2, blink), arch = p.arch * (1 - blink);
  const span = xl => {
    const c = ry * Math.sqrt(Math.max(1 - (xl / rx) ** 2, 0));
    const inward = -e.side * xl / rx; // +1 at the nose side, -1 at the temple
    let hi = Math.min(c, ry * (T - p.tilt * 0.6 * inward));
    let lo = Math.max(-c, ry * (B + arch * (1 - (xl / rx) ** 2)));
    const minT = Math.min(0.016, 2 * c);
    if (hi - lo < minT) { const m = (hi + lo) / 2; hi = m + minT / 2; lo = m - minT / 2; }
    return { c, hi, lo };
  };
  const pos = e.mesh.geometry.attributes.position, zBase = (x, y) => faceZ(x, y) + 0.004;
  pos.setXYZ(0, cx, 0, 0);
  const put = (i, ux, uy, rho) => {
    const xl = ux * rx, { c, hi, lo } = span(xl);
    const t = c > 1e-4 ? (uy * ry + c) / (2 * c) : 0.5;
    const yl = lo + t * (hi - lo), open = clamp((hi - lo) / (2 * ry), 0, 1);
    const X = cx + xl, Y = cy + yl;
    pos.setXYZ(i, X, FACE.z + Y, zBase(X, Y) + EYE.dome * Math.sqrt(Math.max(1 - rho * rho, 0)) * (0.3 + 0.7 * open));
  };
  put(0, 0, 0, 0);
  for (let r = 0; r < e.rings; r++) {
    const rho = (r + 1) / e.rings;
    for (let s = 0; s < e.segs; s++) {
      const a = (s / e.segs) * Math.PI * 2;
      put(1 + r * e.segs + s, Math.cos(a) * rho, Math.sin(a) * rho, rho);
    }
  }
  pos.needsUpdate = true;
  e.mesh.geometry.computeVertexNormals();

  // catchlights ride inside the open part of the eye and vanish when it narrows
  const glint = (m, ux, f) => {
    const xl = ux * rx, { c, hi, lo } = span(xl), open = (hi - lo) / (2 * Math.max(c, 1e-4));
    const X = cx + xl, Y = cy + lerp(lo, hi, f);
    m.position.set(X, FACE.z + Y, zBase(X, Y) + EYE.dome * 0.85);
    m.scale.setScalar(clamp((open - 0.25) * 3, 0, 1) * Math.min(p.rx, 1.25));
  };
  glint(e.big, -0.3, 0.74);
  glint(e.small, 0.34, 0.3);
}

// a closed outline puffed into a pillow; p < 1 keeps the face flat and the edge tight
function inflate(outline, thickness, p, rings = 20) {
  const n = outline.length, cx = outline.reduce((a, o) => a + o.x, 0) / n, cy = outline.reduce((a, o) => a + o.y, 0) / n;
  const pos = [cx, cy, thickness], shadow = [1, 1], idx = [];
  for (let i = 1; i < rings; i++) {
    const phi = (Math.PI * i) / rings, c = Math.cos(phi);
    const r = Math.sin(phi) ** p, z = thickness * Math.sign(c) * Math.abs(c) ** p;
    for (const o of outline) { pos.push(cx + (o.x - cx) * r, cy + (o.y - cy) * r, z); shadow.push(clamp(0.7 + 0.5 * z / thickness, 0.2, 1), 1); } // the rim sinks into shadow
  }
  pos.push(cx, cy, -thickness); shadow.push(0.2, 1);
  const at = (i, j) => 1 + (i - 1) * n + ((j + n) % n), last = pos.length / 3 - 1;
  for (let j = 0; j < n; j++) {
    idx.push(0, at(1, j), at(1, j + 1));
    idx.push(at(rings - 1, j), last, at(rings - 1, j + 1));
    for (let i = 1; i < rings - 1; i++) idx.push(at(i, j), at(i + 1, j), at(i, j + 1), at(i, j + 1), at(i + 1, j), at(i + 1, j + 1));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('shadow', new THREE.Float32BufferAttribute(shadow, 2));
  g.setIndex(idx);
  g.computeVertexNormals();

}
// half-planes of a counter-clockwise triangle: uCut * (x, y, 1) is positive inside, in world units from each edge
function trianglePlanes(a, b, c) {

    const d = q.clone().sub(p).normalize(), n = new THREE.Vector2(-d.y, d.x);
    return [n.x, n.y, -n.dot(p)];

  return new THREE.Matrix3().set(...rows.flat());
}

function setEmotion(name) {
  if (name !== current) enteredAt = clock.elapsedTime;
  current = name;
  lastAttention = clock.elapsedTime;
  for (const b of buttons) b.setAttribute('aria-pressed', String(b.dataset.emo === name));

// Tap / keyboard: show it for a few seconds; doing it again dismisses it.
function activate(name) {
  clearTimeout(holdTimer);
  if (current === name) return setEmotion(null);
  setEmotion(name);
  holdTimer = setTimeout(() => setEmotion(null), 4500);
}
let lastPointerAt = -1e9; // a click or focus right after real pointer input is that same gesture
const fromPointer = () => performance.now() - lastPointerAt < 800;
for (const b of buttons) {
  const name = b.dataset.emo;
  // Rollover is for a real mouse only.
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') { clearTimeout(holdTimer); setEmotion(name); } });
  b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setEmotion(null); });
  // Touch acts on pointerup, never on click: a tap's click can report pointerType "mouse"
  // (or none), so click can't tell a tap from a mouse press that the rollover already handled.
  b.addEventListener('pointerup', e => {
    lastPointerAt = performance.now();
    if (e.pointerType !== 'mouse') activate(name);
  });
  // Keyboard and assistive tech arrive as a click with no pointer gesture before it.
  b.addEventListener('click', () => { if (!fromPointer()) activate(name); });
  b.addEventListener('focus', () => { if (b.matches(':focus-visible') && !fromPointer()) setEmotion(name); });

}

function applyLevel(level) {
  quality.level = level;
  const { pr, step } = LEVELS[level];
  renderer.setPixelRatio(pr);
  renderer.setSize(innerWidth, innerHeight);
  for (const g of furGroups) g.children.forEach((m, i) => { m.visible = i % step === 0; });
}
function trackFrameRate(rawDt) {
  if (quality.locked) return;
  quality.seconds += rawDt; quality.frames++;
  if (quality.seconds < 1.2) return;
  const fps = quality.frames / quality.seconds;
  quality.seconds = quality.frames = 0;
  if (fps >= 26) return;
  // If shedding quality doesn't help, the browser is throttling us and the GPU isn't the
  // limit (background tab, embedded preview), so go back to full quality and stop adapting.
  if (quality.level > 0 && fps < quality.lastFps * 1.2) {
    if (++quality.misses >= 2) { quality.locked = true; applyLevel(0); return; }
  } else quality.misses = 0;
  quality.lastFps = fps;
  if (quality.level < LEVELS.length - 1) applyLevel(quality.level + 1);
}
document.addEventListener('visibilitychange', () => { clock.getDelta(); quality.seconds = quality.frames = 0; });

// ---------- animation ----------
const cur = { ...NEUTRAL };
const motion = { hop: 0, lean: 0, pitch: 0, turn: 0, squash: 0, armOut: 0, armFwd: 0, footL: 0, footR: 0, armSwing: 0 };
const smooth = { ...motion };
const swing = { x: 0, v: 0 }, flop = { x: 0, v: 0 }; // follow-through from spinning / from hopping
let prevRel = null, prevY = 0, prevVy = 0, nextBlink = 2, blinkAt = -10, frames = 0, impatience = 0;
const TAU = Math.PI * 2, ease = u => u * u * (3 - 2 * u);

// One foot's path through a walking cycle: on the floor sliding back, then lifted and carried forward.
const STEP = { y: 0, z: 0, pitch: 0 }, STANCE = 0.56;
function step(p) {
  const F = STEP;
  if (p < STANCE) { F.z = 1 - (2 * p) / STANCE; F.y = 0; F.pitch = 0; }
  else { const u = (p - STANCE) / (1 - STANCE); F.z = -1 + 2 * ease(u); F.y = Math.sin(Math.PI * u); F.pitch = Math.min(0, Math.sin(TAU * u)); } // toe up as it lands (the hinge is at the heel, so tipping it down would sink the toe)
  return F;
}
const CADENCE = 1.5, STRIDE = 0.09, LIFT = 0.1; // cycles per second; half a step's length; how high a foot lifts

renderer.setAnimationLoop(() => {
  const rawDt = clock.getDelta(), dt = Math.min(rawDt, 0.1), t = clock.elapsedTime;
  trackFrameRate(rawDt);
  shared.uTime.value = t;

  // losing patience: ramps in after being ignored, with short pauses between tantrums
  const ignored = !current && !walk.on && t - lastAttention > PATIENCE;
  impatience += ((ignored ? 1 : 0) - impatience) * Math.min(dt * 3, 1);
  spotsEl.classList.toggle('waiting', ignored);

  // settle into the pose
  const pose = current ? POSES[current] : null;
  const k = 1 - Math.exp(-dt * 9);
  for (const key of Object.keys(cur)) {
    let target = NEUTRAL[key];
    if (pose) { if (key in pose) target = pose[key]; }
    else if (key in IMPATIENT) target = lerp(target, IMPATIENT[key], impatience);
    cur[key] += (target - cur[key]) * k;
  }

  // the emotion's ongoing motion (or the idle tantrum)
  for (const key of Object.keys(motion)) motion[key] = 0;
  if (current) MOTIONS[current](t, motion, t - enteredAt);
  else if (impatience > 0.01) {
    const gate = THREE.MathUtils.smoothstep(0.86 - ((t / 4.4) % 1), 0, 0.06); // ~3.8s on, a beat off
    motion.footR = Math.max(0, Math.sin(t * 9.5)) * 0.42 * impatience * gate;
    motion.armSwing = 0.55 * impatience * gate;
    motion.lean = 0.03 * Math.sin(t * 1.75) * impatience;
    motion.squash = 0.012 * Math.max(0, Math.sin(t * 9.5)) * impatience * gate;
  }
  const km = 1 - Math.exp(-dt * 22);
  for (const key of Object.keys(motion)) smooth[key] += (motion[key] * CALM - smooth[key]) * km;

  // walking: how far into it, and where in the cycle (the +x foot lands at 0, the other at 0.5)
  walk.w += ((walk.on ? 1 : 0) - walk.w) * (1 - Math.exp(-dt * 4));
  const w = ease(clamp(walk.w, 0, 1));
  if (walk.w > 0.005) walk.phase = (walk.phase + dt * CADENCE * (0.55 + 0.45 * cur.pace)) % 1;
  const ph = walk.phase, s1 = Math.sin(TAU * ph), c1 = Math.cos(TAU * ph);

  // canvas tap: a couple of hops
  let pogoY = 0, pogoSquash = 0;
  if (POGO.t >= 0) {
    POGO.t += dt;
    const n = POGO.t / POGO.hop;
    if (n >= POGO.hops) POGO.t = -1;
    else {
      const p = n % 1;
      pogoY = POGO.height * Math.sin(Math.PI * p) * CALM;
      pogoSquash = Math.max(0, 1 - Math.min(p, 1 - p) / 0.12) * 0.12 * CALM;
    }
  }
  const y = pogoY + smooth.hop;
  const air = clamp(y / 0.42, 0, 1);
  const vy = (y - prevY) / Math.max(dt, 1e-4), acc = (vy - prevVy) / Math.max(dt, 1e-4);
  prevY = y; prevVy = vy;

  // idle breathing bounce; slower and deeper while asleep
  const breathe = Math.sin(t * (current === 'sueno' ? 1.2 : 2.3));
  const squash = cur.squash + smooth.squash + pogoSquash;
  rig.position.y = y;
  rig.rotation.y += (pointerX * 0.28 - rig.rotation.y) * Math.min(dt * 3, 1);
  upper.scale.set(1 + squash * 0.6 - breathe * 0.007, 1 - squash + breathe * 0.016 * CALM, 1 + squash * 0.6 - breathe * 0.007);
  // walking, the body waddles: it rocks over the standing foot, bobs twice a cycle and turns with the stepping one
  upper.position.set(0.03 * w * s1, HIP - 0.02 * w * Math.cos(2 * TAU * ph), 0);
  upper.rotation.set(cur.pitch + smooth.pitch + 0.03 * w, cur.turn + smooth.turn - 0.08 * w * c1,
    cur.lean + smooth.lean + 0.012 * Math.sin(t * 0.9) - 0.07 * w * s1);

  shared.uBounce.value += (clamp(vy * 0.25, -0.8, 0.8) - shared.uBounce.value) * Math.min(dt * 12, 1);

  // follow-through: spinning the view makes ears and arms trail, then spring back
  const rel = rig.rotation.y - controls.getAzimuthalAngle();
  if (prevRel === null) prevRel = rel;
  const dRel = Math.atan2(Math.sin(rel - prevRel), Math.cos(rel - prevRel));
  prevRel = rel;
  const omega = clamp(dRel / Math.max(dt, 1e-4), -8, 8);
  swing.v += (40 * (omega * 0.05 - swing.x) - 5 * swing.v) * dt;
  swing.x += swing.v * dt;
  flop.v += (-70 * flop.x - 7 * flop.v - clamp(acc, -200, 200) * 0.004) * dt;
  flop.x += flop.v * dt;

  for (const e of ears) {
    const droop = cur.ear + flop.x * 1.1 + cur.earLean * e.sx;
    e.flex.rotation.z = -e.sx * droop + swing.x * 0.35;
    e.flex.rotation.x = -cur.earBack - swing.x * e.sx * 0.5;
  }
  for (const a of arms) {
    const out = cur.armOut + smooth.armOut + air * 0.75 + 0.025 * breathe;
    a.pivot.rotation.z = a.sx * out;
    a.pivot.rotation.x = -(cur.armFwd + smooth.armFwd) - a.sx * smooth.armSwing * Math.sin(t * 4.75)
      - 0.04 * Math.sin(t * 1.1 + a.sx) - swing.x * a.sx * 1.2 + 0.4 * w * a.sx * c1; // each arm swings with the opposite foot
  }
  // feet: tap with the mood; walking, each one steps through the cycle from its heel
  const stride = STRIDE * (0.6 + 0.4 * cur.pace);
  for (const f of feet) {
    const F = step((ph + (f.sx > 0 ? 0 : 0.5)) % 1);
    f.hinge.position.set(f.sx * HEEL.x, HEEL.y + w * LIFT * F.y, HEEL.z + w * stride * F.z);
    f.hinge.rotation.x = -(f.sx > 0 ? smooth.footR : smooth.footL) + 0.3 * w * F.pitch;
  }

  // blink
  const blinkLen = current === 'sueno' ? 0.55 : 0.15;
  if (t > nextBlink) { blinkAt = t; nextBlink = t + 2.4 + Math.random() * 3; }
  const bp = (t - blinkAt) / blinkLen;
  const blink = bp < 1 ? Math.sin(Math.PI * bp) : 0;

  for (const e of eyes) updateEye(e, cur, blink);
  updateMouth(cur);
  updateBlush(cur);

  shadow.scale.setScalar(1 - air * 0.3);
  shadow.material.opacity = 1 - air * 0.5;

  controls.update();
  renderer.render(scene, camera);
  if (++frames === 3) document.getElementById('poster')?.classList.add('gone');
});
</script>
</body>
