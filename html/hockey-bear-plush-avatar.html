<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montréal Hockey Bear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600&family=Oswald:wght@600&display=swap">
<style>
  /* Layout: the bear stands centre stage on white; emotion labels orbit him in an arc with the
     stand / skate switch under his skates. On narrow screens everything collapses into a tray. */
  :root {
    color-scheme: light;
    --bg: #efede8;
    --ink: #16244f;           /* navy, from the toque */
    --muted: #7c869c;
    --pill: rgba(255, 255, 255, .9);
    --line: rgba(22, 36, 79, .18);
    --red: #e0222b;           /* the puffer */
    --navy: #1b2f6b;
    --type: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --rx: min(46vh, calc(50vw - 84px));
    --ry: 36vh;
    --free: 100vh;
    --side: 100vh;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { position: fixed; inset: 0; display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }

  .poster {
    position: fixed; left: 50%; top: calc(var(--free) / 2);
    width: var(--side); height: var(--side); transform: translate(-50%, -50%);
    pointer-events: none; z-index: 1; transition: opacity .6s ease;
  }
  .poster.gone, .poster:not([src^="data:image"]) { opacity: 0; }

  .ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; font-family: var(--type); }
  .spot, .mode button {
    pointer-events: auto; font: 500 16px/1 var(--type); letter-spacing: .01em; color: var(--ink);
    cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
  }
  .spot {
    position: absolute;
    left: calc(50% + var(--x) * var(--rx)); top: calc(var(--free) / 2 + var(--y) * var(--ry));
    transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 9px; min-height: 44px; padding: 0 18px;
    background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(22, 36, 79, .06);
  }
  .spot.toward-right { flex-direction: row-reverse; } /* dot always faces the bear */
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); flex: none; transition: background .18s ease; }
  @media (hover: hover) { .spot:hover { border-color: var(--navy); } }
  .spot:focus-visible, .mode button:focus-visible { outline: 2px solid var(--navy); outline-offset: 3px; }
  .spot[aria-pressed="true"] {
    background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600;
    transform: translate(-50%, -50%) scale(1.07);
  }
  .spot[aria-pressed="true"] .dot { background: #fff; }
  /* when the bear loses patience, the labels quietly ask to be touched */
  .waiting .dot { animation: ping 1.4s ease-out infinite; }
  @keyframes ping {
    0% { box-shadow: 0 0 0 0 rgba(224, 34, 43, .5); }
    100% { box-shadow: 0 0 0 11px rgba(224, 34, 43, 0); }
  }

  .foot {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .mode {
    display: inline-flex; padding: 4px; gap: 4px; background: var(--pill); border: 1px solid var(--line); border-radius: 999px;
    box-shadow: 0 1px 2px rgba(22, 36, 79, .06);
  }
  .mode button { min-height: 40px; min-width: 92px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; }
  .mode button[aria-pressed="true"] { background: var(--red); color: #fff; font-weight: 600; }
  .hint { font: 500 13px/1.3 var(--type); color: var(--muted); }

  @media (max-aspect-ratio: 23/20), (max-width: 720px) {
    .ui {
      inset: auto 0 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    }
    .spot, .spot[aria-pressed="true"] { position: static; transform: none; justify-content: center; padding: 0 2px; font-size: 14px; }
    .dot { display: none; }
    .foot { position: static; grid-column: 1 / -1; grid-row: 1; flex-direction: row; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    .waiting .dot { animation: none; }
    .spot, .poster, .mode button { transition: none; }
  }
</style>

  b.addEventListener('click', () => { if (!fromPointer()) activate(name); });

}

// stand / skate
const standBtn = document.getElementById('stand'), skateBtn = document.getElementById('skate');
const skate = { on: false, w: 0, phase: 0, speed: 0 }; // w eases 0..1 as he gets going; phase runs 0..1 over two pushes
function setSkating(on) {
  if (on && skate.w < 0.05) skate.phase = 0.97; // he starts with a push of the left skate
  skate.on = on;
  standBtn.setAttribute('aria-pressed', String(!on)); skateBtn.setAttribute('aria-pressed', String(on));
  lastAttention = clock.elapsedTime;
}
standBtn.addEventListener('click', () => setSkating(false));
skateBtn.addEventListener('click', () => setSkating(true));

const POGO = { t: -1, hop: 0.46, hops: 2, height: 0.36 };
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; lastAttention = clock.elapsedTime; });
renderer.domElement.addEventListener('pointerup', e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) {
    clearTimeout(holdTimer);
    if (current) setEmotion(null);
    if (POGO.t < 0) POGO.t = 0;
  }
  down = null;
  lastAttention = clock.elapsedTime;
});
controls.addEventListener('change', () => { if (down) lastAttention = clock.elapsedTime; });
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { pointerX = (e.clientX / innerWidth) * 2 - 1; pointerY = (e.clientY / innerHeight) * 2 - 1; } });

// ---------- adaptive quality: fewer pixels first, then fewer fur shells ----------
const LEVELS = [
  { pr: Math.min(devicePixelRatio, 1.5), step: 1 },
  { pr: Math.min(devicePixelRatio, 1.2), step: 1 },
  { pr: 1, step: 1 },
  { pr: 1, step: 2 },
  { pr: 0.75, step: 2 },
  { pr: 0.6, step: 3 },

const quality = { level: 0, seconds: 0, frames: 0, lastFps: 0, misses: 0, locked: false };
function applyLevel(level) {

  renderer.setSize(innerWidth, innerHeight);
  for (const g of furGroups) g.children.forEach((m, i) => { m.visible = i % step === 0; });
}
function trackFrameRate(rawDt) {
  if (quality.locked) return;
  quality.seconds += rawDt; quality.frames++;
  if (quality.seconds < 1.2) return;
  const fps = quality.frames / quality.seconds;
  quality.seconds = quality.frames = 0;
  if (fps >= 26) return;
  // If shedding quality doesn't help, the browser is throttling us and the GPU isn't the
  // limit (background tab, embedded preview), so go back to full quality and stop adapting.
  if (quality.level > 0 && fps < quality.lastFps * 1.2) {
    if (++quality.misses >= 2) { quality.locked = true; applyLevel(0); return; }
  } else quality.misses = 0;
  quality.lastFps = fps;

document.addEventListener('visibilitychange', () => { clock.getDelta(); quality.seconds = quality.frames = 0; });
// ---------- animation ----------
const TAU = Math.PI * 2, ease = u => u * u * (3 - 2 * u);
const cur = { ...NEUTRAL }, face = { ...NEUTRAL };
const motion = { ...MOTION0 }, smooth = { ...MOTION0 };

const look = { x: 0, y: 0 };
const pomTip = { x: V3(), v: V3(), live: false }, POM_TIP = V3(POM.x, POM.y + 0.1, POM.z);
let prevRel = null, prevY = 0, prevVy = 0, nextBlink = 2, blinkAt = -10, frames = 0, impatience = 0;
const _t = V3(), _p = V3(), _a = V3(), _b = V3();
const _q1 = new THREE.Quaternion(), _e = new THREE.Euler();

// One skate's path through a stride, for the left skate: out and back on its inside edge, then lifted home, then gliding.
const STRIDE = { x: 0, y: 0, z: 0, yaw: 0, roll: 0, pitch: 0 }, PUSH = 0.3, RECOVER = 0.22;
function stride(p) {
  const F = STRIDE;
  if (p < PUSH) {
    const u = ease(p / PUSH);
    F.x = 0.1 * u; F.z = -0.15 * u; F.y = 0.02 * u * u; F.yaw = 0.5 * u; F.roll = 0.2 * u; F.pitch = 0.22 * u * u;
  } else if (p < PUSH + RECOVER) {

    F.x = 0.1 * back; F.z = -0.15 * back; F.y = 0.02 * back + 0.08 * up; F.yaw = 0.5 * back; F.roll = 0.2 * back; F.pitch = 0.22 * back + 0.2 * up;
  } else F.x = F.y = F.z = F.yaw = F.roll = F.pitch = 0;

const CADENCE = 1 / 2.4, SPEED = 0.62; // strides per second, units per second

function tick() {

  trackFrameRate(rawDt);

  impatience += ((ignored ? 1 : 0) - impatience) * Math.min(dt * 3, 1);
  uiEl.classList.toggle('waiting', ignored);

  const pose = current ? POSES[current] : null;

  skate.speed += ((skate.on ? SPEED * cur.pace * drive : 0) - skate.speed) * (1 - Math.exp(-dt * (skate.on ? 2.2 : 1.1)));
  const braking = clamp((wasSpeed - skate.speed) / Math.max(dt, 1e-4) * 0.25, 0, 0.12) * (skate.on ? 0 : 1);

  const air = clamp(y / 0.36, 0, 1);
  const vy = (y - prevY) / Math.max(dt, 1e-4), acc = (vy - prevVy) / Math.max(dt, 1e-4);
  prevY = y; prevVy = vy;

  // the whole bear: hops, and turns a little toward the pointer

  rig.rotation.y += (pointerX * 0.28 - rig.rotation.y) * Math.min(dt * 3, 1);
  look.x += (pointerX - look.x) * Math.min(dt * 4, 1); look.y += (pointerY - look.y) * Math.min(dt * 4, 1);

  const breathe = Math.sin(t * (current === 'sleepy' ? 1.2 : 2.3));
  const shift = (0.6 * Math.sin(t * 0.43) + 0.4 * Math.sin(t * 0.29 + 1.3)) * CALM;
  const squash = cur.squash + smooth.squash + pogoSquash;
  const crouch = cur.crouch + smooth.crouch + squash * 0.6 + w * 0.085;
  const sway = -0.085 * w * Math.sin(TAU * (ph - 0.04)) + 0.03 * still * shift;
  const hipRoll = 0.045 * w * s1 - 0.014 * still * shift;
  hips.position.set(sway, HIP_Y - crouch + 0.02 * w * Math.sin(2 * TAU * ph - 0.5), 0.03 * w - 0.02 * braking);
  hips.rotation.set(0.05 * w, 0.09 * w * s1, hipRoll);

  // chest: leans into the skating, turns against the hips, breathes
  const chestLean = cur.lean + smooth.lean - 0.03 * w * s1 + still * (0.012 * Math.sin(t * 0.9) + 0.012 * shift);
  chest.rotation.set(cur.pitch + smooth.pitch + 0.13 * w - braking, cur.turn + smooth.turn - 0.12 * w * s1, chestLean);
  chest.scale.set(1 + squash * 0.5 - breathe * 0.006, 1 - squash * 0.7 + breathe * 0.013 * CALM, 1 + squash * 0.5 + breathe * 0.004);

  head.rotation.set(
    cur.headPitch + smooth.headPitch - 0.12 * w + braking * 0.6 + 0.1 * look.y + wander * 0.025 * Math.sin(t * 0.53 + 1),
    cur.headTurn + smooth.headTurn + 0.1 * w * s1 + 0.22 * look.x + wander * 0.07 * Math.sin(t * 0.37 + 2),
    cur.headTilt + smooth.headTilt - 0.7 * (hipRoll + chestLean) + wander * 0.02 * Math.sin(t * 0.61));
  rig.updateMatrixWorld(true);

  // legs: each skate goes where the stride puts it, and the knees follow
  for (const l of legs) {
    const F = stride((ph + (l.sx > 0 ? 0 : 0.5)) % 1), tap = l.sx > 0 ? smooth.footL : smooth.footR;
    _t.set(l.sx * (HIP.x + 0.02 + w * F.x), ANKLE + w * F.y + 0.12 * tap, w * F.z + 0.02 * still * Math.sin(t * 0.31 + l.sx * 1.4) * CALM + 0.1 * tap);
    _e.set(w * F.pitch - 0.8 * tap, l.sx * (0.14 + w * (F.yaw - 0.08)), l.sx * w * F.roll, 'YXZ');
    reach(l, pointIn(hips, _t), _p.set(l.sx * 0.3, 0, 1), turnIn(hips, _q1.setFromEuler(_e)));
  }

  // arms: the right one waves and gestures; the left one hangs and swings the other way, and joins in as far as `both` says
  const rx = cur.hx + smooth.hx - 0.1 * air - 0.04 * w * Math.abs(s1), ry = cur.hy + smooth.hy + 0.3 * air + 0.01 * breathe, rz = cur.hz + smooth.hz;
  _t.set(rx, ry, rz - 0.2 * w * s1 - 0.25 * swing.x);
  reach(arms[1], _t, _p.set(-0.5, -0.2, -1));
  _t.set(lerp(-NEUTRAL.hx + 0.04 * w * Math.abs(s1), -rx, cur.both), lerp(NEUTRAL.hy + 0.3 * air + 0.01 * breathe, ry, cur.both), lerp(NEUTRAL.hz, rz, cur.both) + 0.2 * w * s1 + 0.25 * swing.x);
  reach(arms[0], _t, _p.set(0.5, -0.2, -1));

  shared.uBounce.value += (clamp(vy * 0.25, -0.8, 0.8) - shared.uBounce.value) * Math.min(dt * 12, 1);

  const rel = rig.rotation.y - controls.getAzimuthalAngle();
  if (prevRel === null) prevRel = rel;
  const dRel = Math.atan2(Math.sin(rel - prevRel), Math.cos(rel - prevRel));
  prevRel = rel;

  swing.x += swing.v * dt;

  flop.x += flop.v * dt;

  pomTip.x.addScaledVector(pomTip.v, dt);

  pom.scale.y = 1 + clamp(_b.y / 0.26, -0.25, 0.25);

  const blinkLen = current === 'sleepy' ? 0.55 : 0.15;
  if (t > nextBlink) { blinkAt = t; nextBlink = t + 2.4 + Math.random() * 3; }
  const bp = (t - blinkAt) / blinkLen;
  Object.assign(face, cur); face.mO += smooth.mO; face.mW += smooth.mO * 0.2;
  updateMouth(face);
  updateEyes(face, bp < 1 ? Math.sin(Math.PI * bp) : 0);

  glasses.position.set(0, GLASSES.y - 0.2 * sp + 0.26 * pop, GLASSES.z + 0.06 * sp + 0.06 * pop);
  glasses.rotation.x = 0.3 * sp - 0.4 * pop;

  blush.uBlush.value.w = clamp(cur.blush, 0, 1);
  blush.uBlushC.value.set(C.blush).lerp(_blushHot, clamp(cur.red, 0, 1));

  // ice and shadows
  ice.material.uniforms.uOffset.value.x += Math.sin(rig.rotation.y) * skate.speed * dt;
  ice.material.uniforms.uOffset.value.y -= Math.cos(rig.rotation.y) * skate.speed * dt;
  bodyShadow.scale.setScalar(1 - air * 0.3);
  bodyShadow.material.opacity = bodyShadow.userData.opacity * (1 - air * 0.5);
  bodyShadow.position.x = rig.position.x + sway * 0.6;
  legs.forEach((l, i) => {
    const s = skateShadows[i], h = l.end.getWorldPosition(_a).y - ANKLE;
    s.position.set(_a.x, 0.005, _a.z + 0.05); s.rotation.z = rig.rotation.y + l.end.getWorldQuaternion(_q1).y * 2;

}

renderer.setAnimationLoop(tick);
